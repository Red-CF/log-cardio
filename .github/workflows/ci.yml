name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # the tool claims platform independence (file/stdin sources) — contract
    # needs a real run on all three
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        # network-fetching tests are faked via PATH stubs (cfg(unix)) so
        # this works offline everywhere

  build:
    # release build is what users install — must stay clean on all OSes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release

  coverage:
    # one OS is enough for coverage — it's a tooling report, not a contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov
      - run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4

  release:
    # a merge to main ships the crate: publish the version the PR bumped in
    # Cargo.toml; if that version is already on crates.io (unbumped merge),
    # bump the patch in the runner and publish that instead. Other publish
    # failures (network, auth) still fail the job loudly.
    needs: [test, build, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # serialize: two near-simultaneous merges compete over version numbers
    concurrency: release-crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        id: pub
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          for attempt in 1 2 3; do
            LOG=$(cargo publish 2>&1) && { echo "published=$V" >> "$GITHUB_OUTPUT"; exit 0; }
            echo "$LOG"
            if echo "$LOG" | grep -q "already exists on crates.io"; then
              V="${V%.*}.$(( ${V##*.} + 1 ))"
              sed -i "s/^version = \".*\"/version = \"$V\"/" Cargo.toml
              echo "cargo: version merged is already published — shipping $V"
            else
              exit 1
            fi
          done
          exit 1
      - name: tag + GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Red-CF"
          git config user.email "crojasfer31@gmail.com"
          git tag "v${{ steps.pub.outputs.published }}"
          git push origin "v${{ steps.pub.outputs.published }}"
          gh release create "v${{ steps.pub.outputs.published }}" --generate-notes