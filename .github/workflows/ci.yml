name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # the tool claims platform independence (file/stdin sources) — contract
    # needs a real run on all three
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        # network-fetching tests are faked via PATH stubs (cfg(unix)) so
        # this works offline everywhere

  build:
    # release build is what users install — must stay clean on all OSes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release

  coverage:
    # one OS is enough for coverage — it's a tooling report, not a contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov
      - run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4

  version:
    # the merge gate: a PR must bump Cargo.toml above what crates.io has,
    # or the merge button stays locked (the release job's auto-bump only
    # covers the rare post-check race of two near-simultaneous merges)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version must be new to crates.io
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          PUBLISHED=$(curl -sfL -A "log-cardio-ci" "https://crates.io/api/v1/crates/log-cardio/versions" | jq -r --arg v "$V" '[.[].num | select(. == $v)] | length')
          [ -n "$PUBLISHED" ] || { echo "registry query failed — try again"; exit 1; }
          if [ "$PUBLISHED" != "0" ]; then
            echo "::error::log-cardio $V is already on crates.io — bump version in Cargo.toml before merging"
            exit 1
          fi

  release:
    # a merge to main ships the crate at the version the PR bumped to (the
    # required `version` check guarantees that version isn't on crates.io
    # yet; a same-version double merge would fail here — bump and re-merge)
    needs: [test, build, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
      - name: tag + GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          git config user.name "Red-CF"
          git config user.email "crojasfer31@gmail.com"
          git tag "v$V"
          git push origin "v$V"
          gh release create "v$V" --generate-notes