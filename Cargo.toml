[package]
name = "log-cardio"
version = "0.1.2"
edition = "2024"
description = "Trim the fat from logs for LLM agents: lean default pipeline (trim + dedup + cap), direct gcloud/bq streaming, trace grouping and surveys — GBs in, tokens out."
license = "MIT"
repository = "https://github.com/Red-CF/log-cardio"

# crate name is log-cardio (cardio was taken on crates.io); the installed
# binary keeps the product name.
[[bin]]
name = "cardio"
path = "src/main.rs"

[dependencies]
bloomfilter = "3.0.2"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.3.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
